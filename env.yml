# MIIRP 物料入库智能审查平台 · Conda 环境定义
# 用法：conda env create -f env.yml
# 环境名：material_inbound · Python 3.12 · 全部依赖为确定版本（无区间）
# 镜像源：conda 通道与 pip 均使用国内清华镜像
#   先执行：python -m pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
# 版本依据：运行时核心与数据库驱动经 fastmcp 3.4.7 依赖树/官方版本核对；测试/质量包为 PyPI 最新稳定版
name: material_inbound
channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge/
dependencies:
  - python=3.12
  - pip=25.3
  - pip:
      # ---- 运行时核心（实测锁定版本）----
      - fastmcp==3.4.7
      - mcp==1.29.0
      - fastapi==0.141.1
      - "uvicorn[standard]==0.52.4"
      - pydantic==2.13.4
      - PyYAML==6.0.3
      - httpx==0.28.1
      - python-multipart==0.0.32
      # ---- 生产数据库（二选一，默认 MySQL）----
      - pymysql==1.2.0             # MySQL（生产默认）
      - psycopg2-binary==2.9.12    # PostgreSQL（备选）
      # ---- 测试与质量（PyPI 最新稳定版）----
      - pytest==9.1.1
      - pytest-asyncio==1.4.0
      - pytest-cov==7.1.0
      - ruff==0.16.3
